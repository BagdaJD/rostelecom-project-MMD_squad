[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rtk-ecosystem-backend"
version = "0.1.0"
description = "Экосистема коммерческого блока: API, загрузка данных, ML"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "geoalchemy2>=0.15",
  "argon2-cffi>=23.1",
  "pyjwt>=2.9",
  "pyotp>=2.9",
  "cryptography>=43",
  "redis>=5.0",
  "rq>=1.18",
  "apscheduler>=3.10",
  "pandas>=2.2",
  "python-docx>=1.1",
  "httpx>=0.27",
]

[project.optional-dependencies]
ml = ["scikit-learn>=1.5", "catboost>=1.2.5"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11"]

[tool.setuptools.packages.find]
include = ["app*", "modules*", "ingestion*", "ml*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "integration: требует PostgreSQL/PostGIS (make up), пропускается без БД",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
