version: needs-1.0
negative_context: '(?:\bбез\b|\bотказ\w*\s+от\b|\bне\s+(?:требу\w*|предусмотр\w*|нуж\w*|планиру\w*|использу\w*))'
categories:
  connectivity:
    label: Связь и каналы передачи данных
    description: Подключение объекта к интернету, оптоволоконные каналы связи, телефония и VPN.
    explicit: ['канал\w*\s+связи', 'оптоволокон\w*', 'оптическ\w*\s+лини\w*', 'доступ\w*\s+в\s+интернет', 'интернет\w*', 'телефони\w*', 'vpn', 'телекоммуникаци\w*']
    exclude: []
    reason: Возможное подключение нового объекта к сети и связь рабочих мест; требуется уточнение у инициатора.
  it_infrastructure:
    label: ИТ-инфраструктура и ЦОД
    description: Серверное оборудование, хранение данных, ЦОД, облачные вычисления и виртуализация.
    explicit: ['сервер\w*', 'цод', 'центр\w*\s+обработки\s+данных', 'виртуализаци\w*', 'облачн\w*\s+(?:вычислен\w*|инфраструктур\w*|сервис\w*)', 'схд']
    exclude: []
    reason: Для управления объектом могут потребоваться вычисления и хранение данных; это гипотеза.
  information_security:
    label: Информационная безопасность
    description: Защита информационных систем от кибератак, SIEM, DLP, защита персональных данных.
    explicit: ['информационн\w*\s+безопасност\w*', 'кибербезопасност\w*', 'siem', 'dlp', 'сиэм', 'защит\w*\s+(?:персональных\s+)?данных', 'защит\w*\s+информаци\w*']
    exclude: ['информационный стенд', 'техника безопасности']
    reason: Работа с цифровыми системами может требовать защиты данных; подтверждённых требований нет.
  video_surveillance:
    label: Видеонаблюдение
    description: Видеонаблюдение территории и периметра, IP-камеры, видеорегистраторы.
    explicit: ['видеонаблюд\w*', 'видеорегистратор\w*', 'ip[- ]?камер\w*', '(?:\d+\s+)?камер(?:а|ы|у|ами|ах)']
    exclude: ['камер\w*\s+(?:сушк\w*|сгоран\w*|хранен\w*|замороз\w*|окрас\w*)', 'холодильн\w*\s+камер\w*']
    reason: Контроль территории и доступа может быть полезен для данного объекта; это предположение.
  iot_asu_tp:
    label: IoT и АСУ ТП
    description: Промышленная автоматизация, АСУ ТП, датчики, телеметрия и диспетчеризация оборудования.
    explicit: ['асу\s*тп', 'асуэ', 'диспетчеризаци\w*', 'датчик\w*', 'телеметри\w*', 'iot', 'промышленн\w*\s+автоматизаци\w*']
    exclude: []
    reason: Для производства возможны мониторинг оборудования и автоматизация; это гипотеза, а не требование заказчика.
scenarios:
  - id: production
    patterns: ['завод\w*', 'производств\w*', 'комбикормов\w*', 'цех\w*', 'технопарк\w*', 'переработк\w*']
    needs: [iot_asu_tp, connectivity, video_surveillance]
    industry: industry
  - id: logistics
    patterns: ['склад\w*', 'логистическ\w*', 'портов\w*', 'терминал\w*']
    needs: [video_surveillance, connectivity, it_infrastructure]
    industry: logistics
  - id: hospitality
    patterns: ['баз\w*\s+отдыха', 'гостиниц\w*', 'отел\w*', 'пляж\w*', 'картодром\w*', 'стадион\w*', 'спортивн\w*', 'физкультурно[- ]оздоровительн\w*', 'развлекательн\w*']
    needs: [connectivity, video_surveillance]
    industry: services
  - id: housing
    patterns: ['жил\w*\s+(?:дом\w*|комплекс\w*)', 'многоквартирн\w*', 'жк', 'развити\w*\s+территори\w*']
    needs: [connectivity, video_surveillance]
    industry: housing
  - id: agriculture
    patterns: ['теплиц\w*', 'выращиван\w*', 'аквакультур\w*', 'рыб\w*', 'сельскохозяйственн\w*']
    needs: [iot_asu_tp, video_surveillance]
    industry: agriculture
  - id: commerce
    patterns: ['торгов\w*', 'потребительск\w*\s+рынк\w*', 'общественн\w*\s+питан\w*', 'дорожн\w*\s+сервис\w*']
    needs: [connectivity, video_surveillance]
    industry: trade
  - id: health
    patterns: ['медицинск\w*', 'медскан\w*', 'клиник\w*', 'больниц\w*']
    needs: [information_security, it_infrastructure, connectivity]
    industry: services
