# Isolated test stack. No application data or production volumes are mounted.
services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: rtk
      POSTGRES_PASSWORD: test-only-password
      POSTGRES_DB: rtk_test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rtk -d rtk_test"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  tests:
    build:
      context: ../..
      dockerfile: infra/docker/backend.Dockerfile
      args:
        INSTALL_DEV: "true"
    environment:
      APP_ENV: test
      SECRET_KEY: test-only-signing-key-01234567890123456789
      TOTP_ENCRYPTION_KEY: test-only-encryption-key-0123456789012345
      DATABASE_URL: postgresql+psycopg://rtk:test-only-password@postgres:5432/rtk_test
      REDIS_URL: redis://redis:6379/15
      REQUIRE_INTEGRATION: "1"
    volumes:
      - ../../data:/srv/data:ro
    command: ["sh", "-c", "alembic upgrade head && alembic check && pytest -q"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
