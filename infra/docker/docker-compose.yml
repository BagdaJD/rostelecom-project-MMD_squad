services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rtk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rtk}
      POSTGRES_DB: ${POSTGRES_DB:-rtk}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../infra/scripts/init-db.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rtk} -d ${POSTGRES_DB:-rtk}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ..
      dockerfile: infra/docker/backend.Dockerfile
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-rtk}:${POSTGRES_PASSWORD:-rtk}@postgres:5432/${POSTGRES_DB:-rtk}
      REDIS_URL: redis://redis:6379/0
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    volumes:
      - ../backend:/srv/backend
      - exports:/srv/backend/exports
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    ports:
      - "8000:8000"

  worker:
    build:
      context: ..
      dockerfile: infra/docker/backend.Dockerfile
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-rtk}:${POSTGRES_PASSWORD:-rtk}@postgres:5432/${POSTGRES_DB:-rtk}
      REDIS_URL: redis://redis:6379/0
    command: ["python", "-m", "app.workers.main"]
    volumes:
      - ../backend:/srv/backend
      - exports:/srv/backend/exports
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}

  frontend:
    image: node:22-alpine
    working_dir: /srv/frontend
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_URL: http://localhost:8000/api/v1
    volumes:
      - ../frontend:/srv/frontend
      - node_modules:/srv/frontend/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  pgdata:
  redisdata:
  exports:
  node_modules:
