name: ci

on:
  push:
    branches: [main, master, dev, deal_calculator, backend-upd, 'backend/**']
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: rtk
          POSTGRES_PASSWORD: ci-test-password
          POSTGRES_DB: rtk_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U rtk -d rtk_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      SECRET_KEY: ci-secret-key-not-used-in-production-0123456789
      TOTP_ENCRYPTION_KEY: ci-totp-key-not-used-in-production-0123456789
      DATABASE_URL: postgresql+psycopg://rtk:ci-test-password@localhost:5432/rtk_test
      REDIS_URL: redis://localhost:6379/15
      REQUIRE_INTEGRATION: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -c constraints.txt -e ".[dev]"
      - run: ruff check app modules ingestion ml tests alembic
      - run: alembic upgrade head
      - name: Verify database schema
        run: |
          schema_log="$RUNNER_TEMP/alembic-check.log"
          if alembic check > "$schema_log" 2>&1; then
            cat "$schema_log"
          else
            schema_status=$?
            cat "$schema_log"
            details=$(cat "$schema_log")
            details="${details//'%'/'%25'}"
            details="${details//$'\r'/'%0D'}"
            details="${details//$'\n'/'%0A'}"
            printf '::error title=Alembic schema check::%s\n' "$details"
            exit "$schema_status"
          fi
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build

  demo-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Демо-набор воспроизводим из скрипта
        run: |
          python3 infra/scripts/make_demo_bundle.py
          python3 -c "import json; d=json.load(open('data/seed/demo_bundle.json')); assert len(d['companies'])>0 and len(d['projects'])>0; print('bundle ok')"
