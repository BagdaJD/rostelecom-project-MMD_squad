# Backend + lint + тесты. Docker-сборка не запускается: CI-раннер без PostGIS,
# интеграционные тесты с БД помечены маркером integration и здесь не выполняются.
name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      SECRET_KEY: ci-secret-key-not-used-in-production-0123456789
      TOTP_ENCRYPTION_KEY: ci-totp-key-not-used-in-production-0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check app modules ingestion ml tests
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build

  demo-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Демо-набор воспроизводим из скрипта
        run: |
          python3 infra/scripts/make_demo_bundle.py
          python3 -c "import json; d=json.load(open('data/seed/demo_bundle.json')); assert len(d['companies'])>0 and len(d['projects'])>0; print('bundle ok')"
